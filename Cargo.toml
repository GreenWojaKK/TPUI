[workspace]
resolver = "3"
members = ["crates/viewer-app", "crates/viewer-core", "crates/viewer-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
viewer-core = { path = "crates/viewer-core" }
viewer-ui = { path = "crates/viewer-ui" }

# parquet and the Arrow crates used directly stay on the same arrow-rs release.
parquet = "60.1.0"
# chrono-tz: resolves Timestamp timezone names (e.g. Asia/Seoul) for display.
arrow-array = { version = "60.1.0", features = ["chrono-tz"] }
arrow-buffer = "60.1.0"
arrow-cast = "60.1.0"
arrow-ord = "60.1.0"
arrow-schema = "60.1.0"
arrow-select = "60.1.0"

async-channel = "2.5.0"
# Same releases as GPUI's Windows platform, so they are built once.
raw-window-handle = "0.6"
windows = "0.62.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# bundled: SQLite is compiled in, so reading databases needs no system library.
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
embed-resource = "3.0.12"

# GPUI is pinned to a fork commit: the Zed v1.26.2 release plus one commit that trims image codecs.
# Fork branch: GreenWojaKK/zed tpui/v1.26.2-slim-image
gpui = { git = "https://github.com/GreenWojaKK/zed", rev = "f941f6a1c26a295c051e2a3776d9897093b3db8c" }
gpui_platform = { git = "https://github.com/GreenWojaKK/zed", rev = "f941f6a1c26a295c051e2a3776d9897093b3db8c" }
