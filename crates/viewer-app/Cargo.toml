[package]
name = "viewer-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
async-channel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
unicode-width.workspace = true
viewer-core.workspace = true
viewer-ui.workspace = true

# GPUI enables no Linux display backend by default; enable both Wayland and X11.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[build-dependencies]
embed-resource.workspace = true
